        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            outline: none;

<body class="bg-background font-body-md text-text-primary min-h-screen flex items-center justify-center p-container-padding relative overflow-hidden">
<!-- Ambient Background Accents -->
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-secondary/10 rounded-full blur-[120px] pointer-events-none"></div>
<main class="w-full max-w-md z-10">
<!-- Logo Section -->
<div class="text-center mb-stack-lg">
<h1 class="font-display text-display font-bold bg-clip-text text-transparent bg-gradient-to-r from-primary to-secondary">SpendIQ</h1>
<p class="font-label-sm text-label-sm text-text-muted mt-stack-sm uppercase tracking-widest">Next Gen Finance</p>
</div>
<!-- Auth Card -->
<div class="glass-card rounded-xl p-stack-lg shadow-2xl relative">
<!-- Auth Toggle Switch -->
<div class="bg-surface-container-low p-1 rounded-full flex items-center mb-stack-lg">
<button class="flex-1 py-2 text-label-sm font-label-sm rounded-full bg-surface-container-high text-primary shadow-sm transition-all duration-300">
                    Login
                </button>
<button class="flex-1 py-2 text-label-sm font-label-sm rounded-full text-text-muted hover:text-on-surface transition-all duration-300">
                    Sign Up
                </button>
</div>
<!-- Form Content -->
<form class="space-y-stack-md">
<!-- Inputs Section -->
<div class="space-y-stack-md">
<!-- Email Field -->
<div class="relative">
<label class="block font-label-sm text-label-sm text-text-muted mb-unit" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-lowest/50 border-b border-white/5 py-3 pl-10 pr-4 text-on-surface font-body-md transition-all duration-300 neon-input-focus rounded-t-lg" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="relative">
<div class="flex justify-between items-center mb-unit">
<label class="block font-label-sm text-label-sm text-text-muted" for="password">Password</label>
<a class="text-label-sm font-label-sm text-text-muted hover:text-secondary transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-text-muted text-[20px]" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-lowest/50 border-b border-white/5 py-3 pl-10 pr-4 text-on-surface font-body-md transition-all duration-300 neon-input-focus rounded-t-lg" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-on-surface transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full py-4 bg-gradient-to-r from-[#8B5CF6] to-[#4338CA] rounded-lg font-h2 text-h2 text-white font-bold transition-all duration-300 hover:translate-y-[-2px] active:scale-95 primary-glow mt-stack-md" type="submit">
                    Log In
                </button>
<!-- Divider -->
<div class="flex items-center gap-stack-sm my-stack-md">
<div class="flex-1 h-[1px] bg-white/10"></div>
<span class="text-label-sm font-label-sm text-text-muted">or continue with</span>
<div class="flex-1 h-[1px] bg-white/10"></div>
</div>
<!-- Social Actions -->
<div class="grid grid-cols-2 gap-stack-md">
<button class="flex items-center justify-center gap-stack-sm py-3 px-stack-md glass-card rounded-lg hover:bg-white/5 transition-colors" type="button">
<img alt="Google" class="w-5 h-5 opacity-80" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6xw9MRlxF7t-iZ7i2dGZiFJdtyZYJQP12exWla5v7jY2czkpYb_U1w2-i9eEKPFQefC1mnNaoISdhD6h1ikij5XpoEeaIMxVXWIrTrFuVED12Pm6RZJhUC5Oso_pbmX5zC60-em7zi71kZPhFp46Oyz3e4zgQ9Jwxhk3QGk3avk4NSfwXgvSDBb5BUWl9cBErNBhBeHchDZV_Cn933mK1dLV5fwzWZ8wd6xi8Gkt0oZyjeY_muJ187uw0iSjsnxXy-bMkzvlfJ1XG"/>
<span class="text-label-sm font-label-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-stack-sm py-3 px-stack-md glass-card rounded-lg hover:bg-white/5 transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="terminal">terminal</span>
<span class="text-label-sm font-label-sm">Github</span>
</button>
</div>
</form>
<!-- Trust Badge -->
<div class="mt-stack-lg pt-stack-md border-t border-white/5 flex justify-center items-center gap-2">
<span class="material-symbols-outlined text-text-muted text-[16px] leading-none" data-icon="enhanced_encryption" data-weight="fill" style="font-variation-settings: 'FILL' 1;">enhanced_encryption</span>
<p class="font-label-sm text-label-sm text-text-muted/60 uppercase tracking-wider">Secure &amp; Encrypted</p>
</div>
</div>
<!-- Visual Credibility Section -->
<div class="mt-stack-lg flex flex-col items-center">
<p class="text-label-sm font-label-sm text-text-muted mb-stack-md">Trusted by high-growth startups globally</p>
<div class="flex flex-wrap justify-center gap-stack-lg opacity-40 grayscale contrast-125">
<div class="h-6 w-24 bg-white/20 rounded-full animate-pulse"></div>
<div class="h-6 w-20 bg-white/20 rounded-full animate-pulse"></div>
<div class="h-6 w-28 bg-white/20 rounded-full animate-pulse"></div>
</div>
</div>

<footer class="fixed bottom-0 w-full py-stack-md px-container-padding flex flex-col md:flex-row justify-between items-center gap-4 border-t border-white/5 bg-background/80 backdrop-blur-sm z-20">
<p class="font-label-sm text-label-sm text-text-muted">© 2024 SpendIQ. All rights reserved. Built for the next generation of finance.</p>
<div class="flex gap-stack-lg">
<a class="font-label-sm text-label-sm text-text-muted hover:text-secondary transition-colors" href="#">Privacy Policy</a>
<a class="font-label-sm text-label-sm text-text-muted hover:text-secondary transition-colors" href="#">Terms of Service</a>
<a class="font-label-sm text-label-sm text-text-muted hover:text-secondary transition-colors" href="#">Help Center</a>
</div>
</footer>
</body></html>
